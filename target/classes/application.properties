## ==========================================
## LabCompare - application.properties
## ==========================================
server.servlet.context-path=/

# File upload limits
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
server.tomcat.max-http-form-post-size=20MB
server.tomcat.max-swallow-size=20MB

## Logging
logging.level.org.springframework.web=INFO

## ==========================================
## JWT
## ==========================================
jwt.secret=labcompare-super-secret-key-minimum-256-bits-long-for-hs256
jwt.expiration=86400000

## ==========================================
## App Info
## ==========================================
labcompare.app.name=LabChain
labcompare.app.support-email=support@LabChain.in

## ==========================================
## Async thread pool (non-blocking email)
## ==========================================
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=5
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=email-

## ==========================================
## Prescription / OCR
## ==========================================
labcompare.prescription.upload-dir=${PRESCRIPTION_UPLOAD_DIR:./prescription-uploads}
labcompare.prescription.ocr-enabled=true
labcompare.prescription.tesseract-path=C:/Program Files/Tesseract-OCR/tesseract.exe
labcompare.prescription.tessdata-path=${TESSDATA_PATH:}
